server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Reasonable compression for the JS/CSS bundle. Not for SSE — see below.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API + the SSE stream ───────────────────────────────────────────
    # This block is what makes the live retrieval trace work. nginx buffers
    # proxied responses by default, which would hold every stage event until
    # the graph finished — the UI would sit still for 90s and then jump
    # straight to the answer. Buffering must be off for text/event-stream.
    location /api/ {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE essentials
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        chunked_transfer_encoding on;
        gzip               off;

        # A single question runs the graph for 60-90s, and up to ~4 minutes
        # when the evaluator forces all three retrieval passes. The default
        # 60s read timeout would cut the stream off mid-run.
        proxy_connect_timeout 30s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;

        # PDF uploads
        client_max_body_size 40m;
    }

    # ── Static assets ──────────────────────────────────────────────────
    # Vite emits content-hashed filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy serves stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
